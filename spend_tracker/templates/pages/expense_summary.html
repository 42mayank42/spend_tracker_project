<!DOCTYPE html>
<html>
<head>
    <title>Expense Summary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Expense Summary</h2>

        <a href="/expenses/expense-list/"
           class="btn btn-primary">
            Back to Expenses
        </a>
    </div>

    <!-- Total Spend -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            Total Spend
        </div>

        <div class="card-body">
            <h3 id="totalSpend">₹0</h3>
        </div>
    </div>

    <!-- Spend By Category -->
    <div class="card mb-4">

        <div class="card-header bg-success text-white">
            Spend By Category
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Total Amount</th>
                    </tr>
                </thead>

                <tbody id="categoryTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <!-- Month Over Month -->
    <div class="card mb-4">

        <div class="card-header bg-info text-white">
            Month Over Month Change
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4">
                    <strong>Current Month</strong>
                    <h4 id="currentMonth">₹0</h4>
                </div>

                <div class="col-md-4">
                    <strong>Previous Month</strong>
                    <h4 id="previousMonth">₹0</h4>
                </div>

                <div class="col-md-4">
                    <strong>Change %</strong>
                    <h4 id="percentageChange">0%</h4>
                </div>

            </div>

        </div>

    </div>

    <!-- Insight -->
    <div id="insightContainer"></div>

</div>

<script>

$(document).ready(function () {

    loadSummary();

});

function loadSummary() {

    $.ajax({

        url: "/expenses/summary/",
        type: "GET",

        success: function(response) {

            console.log(response);

            // Total Spend
            $("#totalSpend").text(
                "₹" + response.total_spend
            );

            // Spend By Category
            let categoryRows = "";

            if (
                Object.keys(response.spend_by_category).length === 0
            ) {

                categoryRows = `
                    <tr>
                        <td colspan="2"
                            class="text-center">
                            No Data Found
                        </td>
                    </tr>
                `;

            } else {

                let categoryRows = "";

                response.spend_by_category.forEach(function(item) {

                    categoryRows += `
                        <tr>
                            <td>${item.category}</td>
                            <td>₹${item.total}</td>
                        </tr>
                    `;

                });

                console.log(categoryRows);

                $("#categoryTableBody").html(categoryRows);

            }

            

            // Month Over Month

            $("#currentMonth").text(
                "₹" +
                response.month_over_month_change.current_month
            );

            $("#previousMonth").text(
                "₹" +
                response.month_over_month_change.previous_month
            );

            let percentage =
                response.month_over_month_change
                        .percentage_change;

            $("#percentageChange").text(
                percentage + "%"
            );

            if (percentage > 0) {

                $("#percentageChange")
                    .removeClass("text-danger")
                    .addClass("text-success");

            } else if (percentage < 0) {

                $("#percentageChange")
                    .removeClass("text-success")
                    .addClass("text-danger");

            }

            // Insight

            if (percentage > 20) {

                $("#insightContainer").html(`
                    <div class="alert alert-warning">
                        Spending increased by
                        ${percentage}%
                        compared to last month.
                    </div>
                `);

            } else {

                $("#insightContainer").html("");

            }

        },

        error: function(xhr) {

            console.log(xhr);

            alert(
                "Unable to load summary data."
            );
        }

    });

}

</script>

</body>
</html>
