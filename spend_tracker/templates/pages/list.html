<!DOCTYPE html>
<html>
<head>
    <title>Spend Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Spend Tracker</h2>

    <div class="card mb-4">
        <div class="card-header">
            Add Expense
        </div>

        <div class="card-body">

            <form id="expenseForm">

                <div class="row">

                    <div class="col-md-3">
                        <label>Amount<span class="text-danger">*</span></label>
                        <input type="number"
                               class="form-control"
                               id="amount"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>Category <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               id="category"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>Date <span class="text-danger">*</span></label>
                        <input type="date"
                               class="form-control"
                               id="date"
                               required>
                    </div>

                    <div class="col-md-3">
                        <label>Note</label>
                        <input type="text"
                               class="form-control"
                               id="note">
                    </div>

                </div>

                <div class="mt-3">

                    <button type="submit"
                            class="btn btn-primary">
                        Save Expense
                    </button>

                    <a href="/expenses/expense-summary/"
                    class="btn btn-success ms-2">
                        View Summary
                    </a>

                </div>

            </form>

        </div>
    </div>

    <div class="card">

        <div class="card-header">
            Expense List
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Note</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="expenseTableBody">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

$(document).ready(function () {

    loadExpenses();

    $("#expenseForm").submit(function (e) {

        e.preventDefault();

        let payload = {
            amount: $("#amount").val(),
            category: $("#category").val(),
            note: $("#note").val(),
            date: $("#date").val()
        };

        $.ajax({
            url: "/expenses/create",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(payload),

            success: function () {

                alert("Expense Added Successfully");

                $("#expenseForm")[0].reset();

                loadExpenses();
            },

            error: function (xhr) {

                alert(
                    "Error: " +
                    JSON.stringify(xhr.responseJSON)
                );
            }
        });

    });

});


function loadExpenses() {

    $.ajax({

        url: "/expenses/create",
        type: "GET",

        success: function (response) {
            console.log(response);
            let rows = "";

            $.each(response, function (index, expense) {

                rows += `
                    <tr>
                        <td>${expense.id}</td>
                        <td>₹${expense.amount}</td>
                        <td>${expense.category}</td>
                        <td>${expense.note || '-'}</td>
                        <td>${expense.date}</td>
                    </tr>
                `;
            });

            $("#expenseTableBody").html(rows);
        },

        error: function () {
            alert("Unable to load expenses");
        }

    });

}

</script>

</body>
</html>
